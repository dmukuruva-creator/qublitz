# Correctness-focused lint config. We gate on pyflakes (real bugs: undefined
# names, unused/duplicate imports, wildcard imports) plus syntax errors, and
# deliberately do NOT enforce whole-repo style (E501 line length, etc.) so the
# gate stays meaningful without churning the lab's existing pages.
line-length = 120
target-version = "py312"

# extra_pages/ (Gates / Step-Pulse challenge scaffolding) is **upstream's code, not ours** —
# added by the maintainer (mvwf, 2025-08-07, e7cef632) and present in upstream/main. It is not
# wired into this app's sidebar, and linting it would churn files we do not own and generate
# PR noise against the maintainer. Excluded for ownership reasons, not because it is WIP.
#
# Corrected 2026-08-06: this comment previously said the code was "slated for completion in a
# later cycle (roadmap C06)", which framed it as our unfinished work. It is not ours, and C06
# appears nowhere in the repo. Do not "clean it up" or delete it — that is an upstream conflict
# waiting to happen. (For reference: it currently has 8 ruff findings, all upstream's to fix.)
extend-exclude = ["extra_pages"]

[lint]
select = ["E9", "F"]

# Streamlit pages are executed top-to-bottom by the framework with __name__ set
# to "__main__"; module-level "unused" names are sometimes the rendered output.
[lint.per-file-ignores]
"tests/*" = ["F401"]
